<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phatso | New Site</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #101828, #1f2937);
      color: #f9fafb;
    }
    main {
      width: min(680px, calc(100% - 3rem));
      padding: 2rem;
      border-radius: 16px;
      background: rgb(255 255 255 / 8%);
      border: 1px solid rgb(255 255 255 / 16%);
      box-shadow: 0 10px 30px rgb(0 0 0 / 35%);
      backdrop-filter: blur(3px);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
    }
    p {
      margin: 0;
      color: #d1d5db;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Phatso</h1>
    <p>Your new site is live. Start customizing this landing page.</p>
  </main>
</body>
</html>
